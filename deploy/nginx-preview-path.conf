# Same domain: flowerdog.studio/preview — password-protected staging
# Production at / is served without auth (other server block or upstream).

location /preview/ {
    alias /var/www/flowerdog-preview/;
    index index.html;

    auth_basic "Client preview";
    auth_basic_user_file /etc/nginx/.htpasswd;

    add_header X-Robots-Tag "noindex, nofollow" always;
}

location = /preview {
    return 301 /preview/;
}
