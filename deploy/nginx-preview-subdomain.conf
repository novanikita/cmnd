# preview.flowerdog.studio — static files from preview branch (rsync / CI artifact)
# Production: flowerdog.studio — separate server block or GitHub Pages upstream

server {
    listen 443 ssl http2;
    server_name preview.flowerdog.studio;

    # ssl_certificate ...;
    # ssl_certificate_key ...;

    root /var/www/flowerdog-preview;
    index index.html;

    auth_basic "Client preview";
    auth_basic_user_file /etc/nginx/.htpasswd;

    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}
